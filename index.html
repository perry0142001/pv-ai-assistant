
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PV AI - Your Smart Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

header {
  background: #123b70;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
}

header p {
  margin-bottom: 0;
}

.container {
  max-width: 750px;
  margin: 20px auto;
  padding: 15px;
}

.modes {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.modes button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #dbeafe;
  color: #123b70;
  font-weight: bold;
  cursor: pointer;
}

.modes button.active {
  background: #123b70;
  color: white;
}

#chat {
  background: white;
  min-height: 350px;
  max-height: 55vh;
  overflow-y: auto;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 10px #0001;
}

.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.5;
}

.user {
  background: #dbeafe;
  margin-left: 15%;
}

.bot {
  background: #e8f5e9;
  margin-right: 15%;
}

.input-area {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
}

.input-area button {
  padding: 12px 15px;
  border: none;
  border-radius: 8px;
  background: #123b70;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#voice {
  background: #15803d;
}

.footer {
  text-align: center;
  padding: 20px;
  color: #64748b;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <h1>PV AI</h1>
  <p>Your Smart Assistant</p>
</header>

<div class="container">

  <div class="modes">
    <button id="generalBtn" class="active" onclick="setMode('general')">
      General AI
    </button>

    <button id="propertyBtn" onclick="setMode('property')">
      PV Property
    </button>
  </div>

  <div id="chat">
    <div class="message bot">
      Welcome to PV AI! Ask me anything.

      હું ગુજરાતી, હિન્દી અને English માં જવાબ આપી શકું છું.
    </div>
  </div>

  <div class="input-area">
    <input
      id="question"
      type="text"
      placeholder="Type your question..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    >

    <button id="voice" onclick="speakInput()">🎤</button>
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<div class="footer">
  PV AI | Powered by Gemini AI<br>
  PV Property 7984667329
</div>

<script>
let currentMode = "general";

function setMode(mode) {
  currentMode = mode;

  document.getElementById("generalBtn").classList.toggle(
    "active", mode === "general"
  );

  document.getElementById("propertyBtn").classList.toggle(
    "active", mode === "property"
  );
}

function addMessage(text, type) {
  const chat = document.getElementById("chat");
  const message = document.createElement("div");

  message.className = "message " + type;
  message.textContent = text;

  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;

  return message;
}

async function sendMessage() {
  const input = document.getElementById("question");
  const question = input.value.trim();

  if (!question) return;

  addMessage(question, "user");
  input.value = "";

  const loading = addMessage("PV AI is thinking...", "bot");

  let message = question;

  if (currentMode === "property") {
    message =
      "You are PV Property Assistant. Help with Indian real estate, " +
      "land listings, property advertisements and buyer enquiries. " +
      "Support Gujarati, Hindi and English. Do not invent property details. " +
      "User question: " + question;
  }

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    loading.textContent = response.ok
      ? data.reply
      : "AI Error: " + (data.error || "Please try again.");

  } catch (error) {
    loading.textContent =
      "Connection error. Please check your internet.";
  }
}

function speakInput() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "gu-IN";
  recognition.start();

  recognition.onresult = function(event) {
    document.getElementById("question").value =
      event.results[0][0].transcript;
  };
}
</script>

</body>
</html>
